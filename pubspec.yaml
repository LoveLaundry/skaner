name: love_mobi
description: "Love Laundry Operations — mobile management system (quotations, gate passes, deliveries, billing, linen, HR, reports)."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Networking ──────────────────────────────────────────────────────────────
  http: ^1.2.2

  # ── State ───────────────────────────────────────────────────────────────────
  provider: ^6.1.2

  # ── Storage ─────────────────────────────────────────────────────────────────
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  sqflite: ^2.3.3

  # ── Connectivity (drives the offline outbox) ────────────────────────────────
  connectivity_plus: ^6.0.5

  # ── Scanning ────────────────────────────────────────────────────────────────
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1

  # ── Crypto (AI request signing + idempotency keys) ──────────────────────────
  crypto: ^3.0.5

  # ── Formatting ──────────────────────────────────────────────────────────────
  intl: ^0.19.0

  # ── Charts ──────────────────────────────────────────────────────────────────
  fl_chart: ^0.69.0

  # ── Documents: print / pdf / export / share ─────────────────────────────────
  printing: ^5.13.4
  pdf: ^3.11.1
  csv: ^6.0.0
  share_plus: ^10.1.2

  # ── Media ───────────────────────────────────────────────────────────────────
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  signature: ^5.5.0

  # ── Misc ────────────────────────────────────────────────────────────────────
  collection: ^1.19.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
